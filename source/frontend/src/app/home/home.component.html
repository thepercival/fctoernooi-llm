@if (alert(); as alert) {
  <div class="row justify-content-center g-0">
    <div class="col-sm-12 col-md-10 col-lg-8 mt-3">
      <div class="alert alert-{{alert.type}} text-center">{{alert.message}}</div>
    </div>
  </div>
}
<app-chat-assistant variant="docked" title="Toernooi-assistent" [suggestions]="suggestions"></app-chat-assistant>
