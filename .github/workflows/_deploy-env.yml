name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      core-resource-group:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ENTRA_ADMINPRINCIPAL_ID:
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create ${{ inputs.resource-group }} if not exists
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name ${{ inputs.resource-group }} \
              --location westeurope \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Resources to ${{ inputs.environment }}
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              --resource-group ${{ inputs.resource-group }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters.json \
              --parameters coreResourceGroupName=${{ inputs.core-resource-group }} \
              --parameters environment=${{ inputs.environment }} \
              --parameters entraAdminPrincipalId=${{ secrets.ENTRA_ADMINPRINCIPAL_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/backend/package-lock.json

      - name: Build backend
        working-directory: source/backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Deploy App Service for API Backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: as-fctoernooi-api-${{ inputs.environment }}
          package: source/backend
