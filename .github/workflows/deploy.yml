name: Deploy to Azure

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy-dev:
    if: github.event.pull_request.merged == true
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create rg-cdk-dev if not exists
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name rg-cdk-dev \
              --location westeurope \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-acc:
    needs: deploy-dev
    environment: acc
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create rg-cdk-acc if not exists
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name rg-cdk-acc \
              --location westeurope \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-prd:
    needs: deploy-acc
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create rg-cdk-prd if not exists
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name rg-cdk-prd \
              --location westeurope \
              --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
