openapi: 3.0.3
info:
  title: FCToernooi Chatbot
  version: 1.0.0
  description: Chatbot frontend connecting to an AI agent hosted in Azure AI Foundry.
servers:
  - url: /
paths:
  /chat:
    post:
      summary: Send a message to the AI agent
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Agent response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request.
        '401':
          description: Unauthorized.
        '500':
          description: Agent error.
components:
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message to send to the AI agent.
        threadId:
          type: string
          nullable: true
          description: Conversation thread ID for multi-turn chat. Omit to start a new thread.
    ChatResponse:
      type: object
      properties:
        message:
          type: string
          description: Agent reply.
        threadId:
          type: string
          description: Thread ID to use in subsequent requests.
